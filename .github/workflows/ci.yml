name: CI

# Until now the only workflow here was the tag-triggered publish, so nothing ever
# checked a commit on main or a pull request. Two consequences, both real: a broken
# main was only discovered at release time, and every directory that reads a repo's
# check status reported "CI status not available" for this project.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      # package.json declares engines.node ">=20.18.1" (undici 7's floor), so 20
      # is a claim this repo makes to every consumer. Testing only on the newest
      # runtime would leave that claim unverified; 24 is what publish.yml builds with.
      #
      # Vitest 5 declares Node ^22.12 || ^24 || >=26, so `npm ci` prints an EBADENGINE
      # warning on the Node 20 leg. The leg stays: it is the minimum runtime (set by
      # undici 7 via @page2ai/core). Node 20 reached end of life on 2026-04-30; when
      # Vitest stops running on 20, raise engines.node rather than pinning Vitest back.
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built server over stdio
        # `npm run build` only proves it compiles. This proves the artifact starts
        # and answers BOTH protocol eras -- what an indexer or a client does first,
        # and the part a type-check cannot cover.
        #
        # --assert is not optional here. Without it the probe prints its findings
        # and exits 0 even when the server does not exist, which would make this
        # step a green mark that proves nothing.
        run: node scripts/probe-protocol.mjs --assert node dist/index.js

      - name: The built server exits when its client closes stdin
        # Since 0.5.0 the Agent Bridge's listening socket kept it running after that,
        # holding port 3025 against the client's next instance (fixed in 0.5.3).
        run: node scripts/stdin-exit.mjs dist/index.js

      - name: The built server answers --version with its package version
        # The one way to see which server a name-only npx install runs (T180).
        run: test "$(timeout 10 node dist/index.js --version < /dev/null)" = "$(node -p "require('./package.json').version")"
