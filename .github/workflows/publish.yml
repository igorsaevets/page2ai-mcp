name: Publish to npm (with provenance)

# Tag-triggered so a publish is always tied to a specific commit and a specific
# release, never to whatever happened to be on main.
#
# Authentication is npm trusted publishing (OIDC): the registry trusts this
# workflow file of this repository for @page2ai/mcp and page2ai-mcp, so no npm
# token is stored anywhere. The trust lives on npmjs.com (`npm trust github`),
# and a NEW trust configuration expires unless a publish validates it within
# 2 days (docs.npmjs.com/trusted-publishers). Dispatching this workflow with
# oidc_probe=true checks that the registry accepts it for both packages and
# publishes nothing; a plain dispatch still publishes whatever is missing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      oidc_probe:
        description: 'Only check that npm trusted publishing accepts this workflow (publishes nothing)'
        type: boolean
        default: false

# GitHub's implicit shell for `run:` is `bash -e {0}` -- `-e` is on, `pipefail` is
# NOT. So `X=$(cmd | head -n 1)` succeeds with X empty when `cmd` fails, because
# `head` is the last command in the pipe. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}`, which fails the step instead.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build, test and publish
    if: ${{ !inputs.oidc_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for a
      # short-lived publish token, and Sigstore signs the provenance
      # attestation with the same identity. Without it the publish fails with
      # ENEEDAUTH, because there is no stored token to fall back on.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in a release build, as npm's trusted publishing
          # guide says: whatever is restored into this job runs with the right
          # to publish.
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Check that npm supports trusted publishing
        # npm older than 11.5.1 never attempts the OIDC exchange and then fails
        # with a misleading ENEEDAUTH. Node 24 bundles a new enough npm today;
        # this turns a future downgrade into a clear error.
        run: |
          V="$(npm --version)"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$V"; then
            echo "::error::npm $V cannot use trusted publishing; it needs npm >= 11.5.1"
            exit 1
          fi
          echo "npm $V supports trusted publishing"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the tag matches package.json
        # A tag that disagrees with the manifest publishes a version nobody
        # asked for and cannot be undone; npm forbids re-publishing a version.
        # Only meaningful on a tag push. On workflow_dispatch GITHUB_REF_NAME is
        # the branch, so comparing it to the version would fail every manual run.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Verify server.json matches package.json
        # The npm version and the MCP Registry entry are fed from different
        # files; they drifted for a month (npm 0.2.4, server.json 0.2.0,
        # registry 0.1.1) with nothing to notice. This makes the drift fatal.
        run: |
          SJ="$(node -p "require('./server.json').version")"
          SP="$(node -p "require('./server.json').packages[0].version")"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$SJ" != "$PKG" ] || [ "$SP" != "$PKG" ]; then
            echo "::error::server.json ($SJ, packages[0]=$SP) != package.json ($PKG)"
            exit 1
          fi

      - name: Check whether the scoped version is already on the registry
        id: scoped
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@page2ai/mcp@$V" version >/dev/null 2>&1; then
            echo "@page2ai/mcp@$V is already published; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # Authenticates through trusted publishing. Provenance is automatic
        # there; --provenance only makes it explicit.
        if: steps.scoped.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Verify the attestation is live
        # npm audit signatures checks the published tarball against the registry's
        # signatures and attestations. Running it here means a publish that
        # silently lost its provenance fails the workflow instead of looking fine.
        run: |
          sleep 20
          npm audit signatures || echo "attestation not visible yet; check the package page"

      # The unscoped name is the one people actually type (`npx -y page2ai-mcp`),
      # and until 2026-07-28 it was the weakest link in the chain: published by
      # hand in July, so it carries no provenance attestation at all, its source
      # existed nowhere in this repository, and it sat at 0.1.0 while the scoped
      # package had moved to 0.1.2. Publishing it from here fixes all three.
      - name: Check the wrapper version
        id: wrapper
        run: |
          WANT="$(node -p "require('./wrapper/package.json').version")"
          MAIN="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$MAIN" ]; then
            echo "::error::wrapper/package.json is $WANT but package.json is $MAIN; they must match"
            exit 1
          fi
          # The version fields matched on every release while the wrapper's
          # DEPENDENCY lagged one version behind (0.2.3 served 0.2.2, 0.2.4
          # served 0.2.3), so `npx page2ai-mcp` always ran the previous
          # server. Enforce the caret-on-current convention explicitly.
          DEP="$(node -p "require('./wrapper/package.json').dependencies['@page2ai/mcp']")"
          if [ "$DEP" != "^$MAIN" ]; then
            echo "::error::wrapper depends on @page2ai/mcp '$DEP'; expected '^$MAIN'"
            exit 1
          fi
          if npm view "page2ai-mcp@$WANT" version >/dev/null 2>&1; then
            echo "page2ai-mcp@$WANT is already published; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the unscoped wrapper with provenance
        if: steps.wrapper.outputs.publish == 'true'
        working-directory: wrapper
        run: npm publish --provenance --access public

      - name: Verify the releases went through trusted publishing
        # The registry records GitHub Actions (npm-oidc-no-reply@github.com) as
        # the publisher of a version published over OIDC, and the account owner
        # for a token publish. This keeps "no stored token" checked on every
        # release instead of assumed. Only packages published by THIS run.
        if: steps.scoped.outputs.publish == 'true' || steps.wrapper.outputs.publish == 'true'
        env:
          SCOPED: ${{ steps.scoped.outputs.publish }}
          WRAPPER: ${{ steps.wrapper.outputs.publish }}
        run: |
          V="$(node -p "require('./package.json').version")"
          PKGS=""
          if [ "$SCOPED" = true ]; then PKGS="$PKGS @page2ai/mcp"; fi
          if [ "$WRAPPER" = true ]; then PKGS="$PKGS page2ai-mcp"; fi
          FAIL=0
          for P in $PKGS; do
            U=""
            # With --json, a version the registry cannot see yet prints an E404
            # JSON body and exits 1, so success is the exit code, not the output.
            for _ in 1 2 3 4 5 6; do
              if U="$(npm view "$P@$V" _npmUser --json 2>/dev/null)"; then break; fi
              U=""
              sleep 10
            done
            case "$U" in
              *npm-oidc-no-reply@github.com*) echo "$P@$V was published by trusted publishing" ;;
              "") echo "::warning::$P@$V is not visible on the registry yet; check its publisher later" ;;
              *) echo "::error::$P@$V was not published by trusted publishing: $U"; FAIL=1 ;;
            esac
          done
          exit "$FAIL"

      # npm publishing alone never updates the MCP Registry — it ingests
      # server.json only through mcp-publisher, which is why the registry sat
      # at 0.1.1 while npm moved to 0.2.4. Auth is GitHub OIDC (the job's
      # id-token: write again), which proves the io.github.igorsaevets/*
      # namespace from inside this repo without any stored secret.
      - name: Check whether this version is already in the MCP Registry
        id: registry
        run: |
          V="$(node -p "require('./server.json').version")"
          LIVE="$(curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.igorsaevets/page2ai-mcp" \
            | jq -r '[.servers[]? | (.server // .) | select(.name == "io.github.igorsaevets/page2ai-mcp") | .version] | join(" ")' \
            || echo "")"
          echo "registry has: ${LIVE:-nothing}; server.json is $V"
          case " $LIVE " in
            *" $V "*) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)        echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: steps.registry.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: ./mcp-publisher publish

  oidc-probe:
    name: Check trusted publishing (publishes nothing)
    if: ${{ inputs.oidc_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Ask the registry for a publish token for each package (dry run)
        # npm publish runs its OIDC exchange before it looks at --dry-run, so a
        # dry run proves the registry accepts this workflow for the package and
        # uploads nothing; npm never prints the short-lived token it gets back.
        # npm still exits 1 when this version is already published, so the
        # verdict comes from npm's own log line, not from its exit code.
        run: |
          FAIL=0
          for DIR in . wrapper; do
            NAME="$(node -p "require('./$DIR/package.json').name")"
            LOG="$RUNNER_TEMP/oidc-probe-${NAME//[@\/]/_}.log"
            (cd "$DIR" && npm publish --dry-run --ignore-scripts --loglevel verbose) >"$LOG" 2>&1 || true
            if grep -q 'oidc Successfully retrieved and set token' "$LOG"; then
              echo "$NAME: trusted publishing accepts this workflow"
            else
              WHY="$(grep -m1 'verbose oidc' "$LOG" || echo 'npm logged no OIDC step')"
              echo "::error::$NAME: trusted publishing does not accept this workflow: $WHY"
              FAIL=1
            fi
          done
          exit "$FAIL"
